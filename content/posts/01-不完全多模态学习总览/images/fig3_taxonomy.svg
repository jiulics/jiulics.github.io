<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <defs>
    <style>
      .title { font: 700 30px "Microsoft YaHei", Arial, sans-serif; fill: #172033; }
      .subtitle { font: 400 16px "Microsoft YaHei", Arial, sans-serif; fill: #526071; }
      .box { fill: #ffffff; stroke: #25324a; stroke-width: 1.6; rx: 8; }
      .head { fill: #eef4ff; stroke: #25324a; stroke-width: 1.8; rx: 8; }
      .green { fill: #eefaf2; }
      .yellow { fill: #fff8e6; }
      .pink { fill: #fff0f3; }
      .blue { fill: #eef4ff; }
      .gray { fill: #f6f7f9; }
      .text { font: 500 17px "Microsoft YaHei", Arial, sans-serif; fill: #172033; }
      .small { font: 400 13px "Microsoft YaHei", Arial, sans-serif; fill: #526071; }
      .arrow { stroke: #526071; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#526071"/>
    </marker>
  </defs>

  <rect width="1400" height="900" fill="#fbfcfe"/>
  <text x="60" y="56" class="title">不完全多模态学习技术路线图</text>
  <text x="60" y="84" class="subtitle">围绕缺失模态下的稳健融合、跨模态对齐、缺失模态补全与参数高效适配展开</text>

  <rect x="530" y="130" width="340" height="82" class="head"/>
  <text x="700" y="165" text-anchor="middle" class="text">不完全多模态问题</text>
  <text x="700" y="190" text-anchor="middle" class="small">training/test missing modality</text>

  <rect x="70" y="290" width="270" height="78" class="box gray"/>
  <text x="205" y="323" text-anchor="middle" class="text">缺失发生位置</text>
  <text x="205" y="348" text-anchor="middle" class="small">训练缺失 / 测试缺失 / 未见组合</text>

  <rect x="390" y="290" width="280" height="78" class="box blue"/>
  <text x="530" y="323" text-anchor="middle" class="text">对齐</text>
  <text x="530" y="348" text-anchor="middle" class="small">contrastive / prototype / distillation</text>

  <rect x="730" y="290" width="280" height="78" class="box green"/>
  <text x="870" y="323" text-anchor="middle" class="text">补全</text>
  <text x="870" y="348" text-anchor="middle" class="small">feature / text / image generation</text>

  <rect x="1060" y="290" width="270" height="78" class="box yellow"/>
  <text x="1195" y="323" text-anchor="middle" class="text">稳健适配</text>
  <text x="1195" y="348" text-anchor="middle" class="small">prompt / LoRA / MoE / SSM</text>

  <path d="M 620 212 C 480 240, 310 250, 210 290" class="arrow"/>
  <path d="M 675 212 C 620 245, 565 260, 530 290" class="arrow"/>
  <path d="M 725 212 C 790 245, 840 260, 870 290" class="arrow"/>
  <path d="M 780 212 C 930 240, 1090 250, 1195 290" class="arrow"/>

  <rect x="70" y="420" width="270" height="56" class="box"/>
  <text x="205" y="453" text-anchor="middle" class="text">MCAR / MAR / MNAR</text>
  <rect x="70" y="495" width="270" height="56" class="box"/>
  <text x="205" y="528" text-anchor="middle" class="text">模态强弱与主导性</text>
  <rect x="70" y="570" width="270" height="56" class="box"/>
  <text x="205" y="603" text-anchor="middle" class="text">训练-部署缺失偏移</text>

  <rect x="390" y="420" width="280" height="56" class="box"/>
  <text x="530" y="444" text-anchor="middle" class="text">概率对齐</text>
  <text x="530" y="464" text-anchor="middle" class="small">避免信息不对称下的硬点对齐</text>
  <rect x="390" y="495" width="280" height="56" class="box"/>
  <text x="530" y="519" text-anchor="middle" class="text">任务子空间对齐</text>
  <text x="530" y="539" text-anchor="middle" class="small">保留 modality-specific residual</text>
  <rect x="390" y="570" width="280" height="56" class="box"/>
  <text x="530" y="594" text-anchor="middle" class="text">语义原型对齐</text>
  <text x="530" y="614" text-anchor="middle" class="small">弱配对、多视图、无配对可迁移</text>

  <rect x="730" y="420" width="280" height="56" class="box"/>
  <text x="870" y="444" text-anchor="middle" class="text">潜特征补全</text>
  <text x="870" y="464" text-anchor="middle" class="small">MMIN / ShaSpec / M3AE</text>
  <rect x="730" y="495" width="280" height="56" class="box"/>
  <text x="870" y="519" text-anchor="middle" class="text">生成式补全</text>
  <text x="870" y="539" text-anchor="middle" class="small">diffusion / LMM / knowledge graph</text>
  <rect x="730" y="570" width="280" height="56" class="box"/>
  <text x="870" y="594" text-anchor="middle" class="text">多候选生成与排序</text>
  <text x="870" y="614" text-anchor="middle" class="small">质量、任务收益、校准共同约束</text>

  <rect x="1060" y="420" width="270" height="56" class="box"/>
  <text x="1195" y="444" text-anchor="middle" class="text">Missing-aware Prompt</text>
  <text x="1195" y="464" text-anchor="middle" class="small">MMP / Deep Correlated Prompting</text>
  <rect x="1060" y="495" width="270" height="56" class="box"/>
  <text x="1195" y="519" text-anchor="middle" class="text">低秩跨模态适配</text>
  <text x="1195" y="539" text-anchor="middle" class="small">MoRA: shared + specific LoRA</text>
  <rect x="1060" y="570" width="270" height="56" class="box"/>
  <text x="1195" y="594" text-anchor="middle" class="text">动态专家与状态空间</text>
  <text x="1195" y="614" text-anchor="middle" class="small">SimMLM / LS3M</text>

  <path d="M 205 368 L 205 420" class="arrow"/>
  <path d="M 530 368 L 530 420" class="arrow"/>
  <path d="M 870 368 L 870 420" class="arrow"/>
  <path d="M 1195 368 L 1195 420" class="arrow"/>

  <rect x="180" y="725" width="1040" height="92" class="box pink"/>
  <text x="700" y="756" text-anchor="middle" class="text">后续可做的核心方向</text>
  <text x="700" y="784" text-anchor="middle" class="small">把“对齐”从确定性点匹配推进到不确定性、任务相关、原型语义对齐；把“补全”从重建像素/特征推进到可校准、可拒识、任务收益可解释的多候选补全。</text>
</svg>

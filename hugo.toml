baseURL = 'https://jiulics.github.io/'
locale = 'zh-CN'
defaultContentLanguage = 'zh-CN'
title = 'jiulics'
theme = 'reimu'
timeZone = 'Asia/Shanghai'
hasCJKLanguage = true
copyright = '© 2026 jiulics'

[languages]
  [languages.zh-CN]
    label = '简体中文'
    weight = 1
    hasCJKLanguage = true

[params]
  env = 'production'
  author = 'jiulics'
  description = '关于多智能体协作、强化学习、无人机低空城市应急与多模态融合的研究记录。'
  subtitle = '研究领域涉及多智能体协作、强化学习、无人机低空城市应急与多模态融合。'
  mainSections = ['posts']
  banner = 'images/generated/blog-bg.png'
  avatar = 'avatar.jpg'
  reimu_cursor = false
  keywords = ['多智能体协作', '强化学习', '无人机', '低空城市应急', '多模态融合', '协同计算']

  [params.preloader]
    enable = false

  [params.firework]
    enable = false

  [params.top]
    enable = true
    position = 'right'

    [params.top.icon]
      url = '../avatar/avatar.jpg'
      rotate = false
      mask = false

  [params.injector]
    head_end = '''
<style>
.sidebar-top {
  width: 54px;
  height: 54px;
  opacity: 1 !important;
  border: 1px solid rgba(255, 255, 255, 0.78);
  background: #fff;
  box-shadow: 0 10px 26px rgba(0, 0, 0, 0.2), 0 0 0 5px rgba(255, 255, 255, 0.34);
  transition: transform 180ms ease, box-shadow 180ms ease;
}

[data-theme="dark"] .sidebar-top {
  background: #15181f;
  box-shadow: 0 10px 28px rgba(0, 0, 0, 0.48), 0 0 0 5px rgba(99, 212, 223, 0.12);
}

.sidebar-top:hover {
  transform: translateY(-3px) rotate(6deg);
  box-shadow: 0 16px 34px rgba(0, 0, 0, 0.26), 0 0 0 6px rgba(18, 136, 155, 0.16);
}

.sidebar-top .sidebar-top-taichi,
.sidebar-top:hover .sidebar-top-taichi {
  position: absolute;
  inset: 5px;
  width: auto;
  height: auto;
  opacity: 1 !important;
  border-radius: 50%;
  background: url('/avatar/avatar.jpg') center / cover no-repeat !important;
  background-size: cover !important;
  box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.86);
  -webkit-mask: none !important;
  mask: none !important;
  transition: transform 220ms ease;
}

.sidebar-top .sidebar-top-taichi::after {
  content: "";
  position: absolute;
  inset: -3px;
  border-radius: inherit;
  border: 2px solid transparent;
  border-top-color: #12889b;
  border-right-color: #bb7a1b;
  opacity: 0.86;
}

.sidebar-top:hover .sidebar-top-taichi {
  transform: rotate(14deg) scale(1.04);
}

.sidebar-top .arrow-up,
.sidebar-top:hover .arrow-up {
  position: absolute;
  right: 3px;
  bottom: 3px;
  width: 17px;
  height: 17px;
  opacity: 1 !important;
  border-radius: 50%;
  background: rgba(5, 5, 5, 0.72);
  color: #fff;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
}

.sidebar-top .arrow-up::before {
  top: 0;
  left: 0;
  width: 17px;
  height: 17px;
  color: #fff;
  font-size: 10px;
  line-height: 17px;
}
</style>
<link rel="icon" href="/favicon.ico?v=avatar-20260522" sizes="any">
<link rel="shortcut icon" href="/favicon.ico?v=avatar-20260522">
'''

  [params.summary]
    enable = true
    style = 'subtitle'

  [params.sort_order]
    home = 'date-reverse'
    archive = 'date-reverse'

  [[params.menu]]
    name = 'home'
    url = ''
    icon = false

  [[params.menu]]
    name = 'research'
    url = 'research'
    icon = false

  [[params.menu]]
    name = 'archives'
    url = 'archives'
    icon = false

  [[params.menu]]
    name = 'tags'
    url = 'tags'
    icon = false

  [params.footer]
    since = 2026
    powered = true
    count = true
    busuanzi = false

  [params.sidebar]
    position = 'right'
    menu = true

    [params.sidebar.article]
      show_common = true

[outputs]
  home = ['HTML', 'RSS', 'JSON']

[caches]
  [caches.images]
    dir = ':cacheDir/images'

[markup]
  [markup.highlight]
    guessSyntax = true
    noClasses = false
  [markup.goldmark]
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.passthrough]
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
          block = [['\[', '\]'], ['$$', '$$']]
          inline = [['\(', '\)']]

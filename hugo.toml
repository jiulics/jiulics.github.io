baseURL = 'https://jiulics.github.io/'
locale = 'zh-cn'
defaultContentLanguage = 'zh'
title = 'jiulics'
theme = 'PaperMod'
timeZone = 'Asia/Shanghai'
hasCJKLanguage = true
copyright = '© 2026 jiulics'

[params]
  env = 'production'
  description = '关于多智能体协作、强化学习、无人机低空城市应急与多模态融合的研究记录。'
  author = 'jiulics'
  defaultTheme = 'light'
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = true
  ShowRssButtonInSectionTermList = true
  mainSections = ['posts']
  keywords = ['多智能体协作', '强化学习', '无人机', '低空城市应急', '多模态融合', '协同计算']

  [params.assets]
    favicon = 'favicon.svg'
    favicon16x16 = 'favicon.svg'
    favicon32x32 = 'favicon.svg'
    apple_touch_icon = 'favicon.svg'
    safari_pinned_tab = 'safari-pinned-tab.svg'
    theme_color = '#07111f'
    msapplication_TileColor = '#07111f'

  [params.label]
    text = 'jiulics'
    icon = 'images/brand-mark.svg'
    iconHeight = 34

  [params.homeInfoParams]
    Title = 'jiulics'
    Content = '研究领域涉及多智能体协作、强化学习、无人机、低空城市应急多模态融合。'

[[menu.main]]
  identifier = 'research'
  name = '研究'
  url = '/research/'
  weight = 5

[[menu.main]]
  identifier = 'posts'
  name = '文章'
  url = '/posts/'
  weight = 10

[[menu.main]]
  identifier = 'archives'
  name = '归档'
  url = '/archives/'
  weight = 20

[[menu.main]]
  identifier = 'tags'
  name = '标签'
  url = '/tags/'
  weight = 30

[outputs]
  home = ['HTML', 'RSS', 'JSON']

[caches]
  [caches.images]
    dir = ':cacheDir/images'

[markup]
  [markup.goldmark]
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.passthrough]
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
          block = [['\[', '\]'], ['$$', '$$']]
          inline = [['\(', '\)']]

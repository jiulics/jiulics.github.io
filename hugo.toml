baseURL = 'https://jiulics.github.io/'
locale = 'zh-cn'
defaultContentLanguage = 'zh'
title = 'jiulics'
theme = 'PaperMod'
timeZone = 'Asia/Shanghai'
hasCJKLanguage = true
copyright = '© 2026 jiulics'

[params]
  env = 'production'
  description = '低空城市应急、多模态融合、Mamba 与协同计算的研究笔记。'
  author = 'jiulics'
  defaultTheme = 'dark'
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = true
  ShowRssButtonInSectionTermList = true
  mainSections = ['posts']
  keywords = ['无人机', '多模态融合', 'Mamba', '红外可见光融合', '协同计算']

  [params.homeInfoParams]
    Title = 'jiulics'
    Content = '面向低空城市应急的多模态感知研究笔记：从红外/可见光融合、Vision Mamba 到多无人机协同推理。'

[[menu.main]]
  identifier = 'research'
  name = '研究'
  url = '/research/'
  weight = 5

[[menu.main]]
  identifier = 'posts'
  name = '文章'
  url = '/posts/'
  weight = 10

[[menu.main]]
  identifier = 'archives'
  name = '归档'
  url = '/archives/'
  weight = 20

[[menu.main]]
  identifier = 'tags'
  name = '标签'
  url = '/tags/'
  weight = 30

[outputs]
  home = ['HTML', 'RSS', 'JSON']

[caches]
  [caches.images]
    dir = ':cacheDir/images'

[markup]
  [markup.goldmark]
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.passthrough]
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
          block = [['\[', '\]'], ['$$', '$$']]
          inline = [['\(', '\)']]

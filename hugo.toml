baseURL = 'https://jiulics.github.io/'
locale = 'zh-cn'
defaultContentLanguage = 'zh'
title = 'jiulics'
theme = 'PaperMod'
timeZone = 'Asia/Shanghai'
hasCJKLanguage = true
copyright = '© 2026 jiulics'

[params]
  env = 'production'
  description = '关于 AI 表征、多模态感知、长序列建模与系统优化的研究笔记。'
  author = 'jiulics'
  defaultTheme = 'light'
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = true
  ShowRssButtonInSectionTermList = true
  mainSections = ['posts']
  keywords = ['AI', '多模态融合', 'Mamba', '表征学习', '系统优化', '协同计算']

  [params.homeInfoParams]
    Title = 'jiulics'
    Content = '记录 AI 模型机制、表征学习、多模态感知、长序列建模与系统优化。'

[[menu.main]]
  identifier = 'research'
  name = '研究'
  url = '/research/'
  weight = 5

[[menu.main]]
  identifier = 'posts'
  name = '文章'
  url = '/posts/'
  weight = 10

[[menu.main]]
  identifier = 'archives'
  name = '归档'
  url = '/archives/'
  weight = 20

[[menu.main]]
  identifier = 'tags'
  name = '标签'
  url = '/tags/'
  weight = 30

[outputs]
  home = ['HTML', 'RSS', 'JSON']

[caches]
  [caches.images]
    dir = ':cacheDir/images'

[markup]
  [markup.goldmark]
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.passthrough]
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
          block = [['\[', '\]'], ['$$', '$$']]
          inline = [['\(', '\)']]

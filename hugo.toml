baseURL = 'https://jiulics.github.io/'
locale = 'zh-CN'
defaultContentLanguage = 'zh-CN'
title = 'jiulics'
theme = 'reimu'
timeZone = 'Asia/Shanghai'
hasCJKLanguage = true
copyright = '© 2026 jiulics'

[languages]
  [languages.zh-CN]
    label = '简体中文'
    weight = 1
    hasCJKLanguage = true

[params]
  env = 'production'
  author = 'jiulics'
  description = '关于多智能体协作、强化学习、无人机低空城市应急与多模态融合的研究记录。'
  subtitle = '研究领域涉及多智能体协作、强化学习、无人机低空城市应急与多模态融合。'
  mainSections = ['posts']
  banner = 'images/generated/blog-bg.png'
  avatar = 'avatar.jpg'
  reimu_cursor = false

  [params.preloader]
    enable = false
  [params.firework]
    enable = false
  keywords = ['多智能体协作', '强化学习', '无人机', '低空城市应急', '多模态融合', '协同计算']

  [params.summary]
    enable = true
    style = 'subtitle'

  [params.sort_order]
    home = 'date-reverse'
    archive = 'date-reverse'

  [[params.menu]]
    name = 'home'
    url = ''
    icon = false

  [[params.menu]]
    name = 'research'
    url = 'research'
    icon = false

  [[params.menu]]
    name = 'archives'
    url = 'archives'
    icon = false

  [[params.menu]]
    name = 'tags'
    url = 'tags'
    icon = false

  [params.footer]
    since = 2026
    powered = true
    count = true
    busuanzi = false

  [params.sidebar]
    position = 'right'
    menu = true

    [params.sidebar.article]
      show_common = true

[outputs]
  home = ['HTML', 'RSS', 'JSON']

[caches]
  [caches.images]
    dir = ':cacheDir/images'

[markup]
  [markup.highlight]
    guessSyntax = true
    noClasses = false
  [markup.goldmark]
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.passthrough]
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
          block = [['\[', '\]'], ['$$', '$$']]
          inline = [['\(', '\)']]
